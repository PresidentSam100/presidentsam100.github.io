<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ctext%20y%3D%220.9em%22%20font-size%3D%2288%22%3E%F0%9F%8D%89%3C%2Ftext%3E%3C%2Fsvg%3E" />
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Jam Jar</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<script src="../motion-toggle.js"></script>
<script src="../mute-toggle.js"></script>
<script src="../game-shell.js"></script>
    <meta name="description" content="Jam Jar — drop fruit into the jar and merge pairs into ever bigger fruit. A browser game by Sam Lu." />
    <meta property="og:title" content="Jam Jar — Sam Lu" />
    <meta property="og:type" content="website" />
    <meta property="og:description" content="Jam Jar — a merge-drop puzzle in a pantry preserving jar. A browser game by Sam Lu." />
    <meta name="twitter:card" content="summary" />
    <meta name="author" content="Sam Lu" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-H1K8QYFCV5"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag("js", new Date());
      gtag("config", "G-H1K8QYFCV5");
    </script>
</head>
<body>
<a href="../" class="nav-back-games" aria-label="Back to games" style="position:fixed;top:12px;left:12px;z-index:99999;text-decoration:none;font:800 14px/1 'Baloo 2',system-ui,sans-serif;color:#5a3218;background:#fff3df;border:2px solid #b9793e;border-radius:12px;box-shadow:0 3px 0 #8f5a2b;padding:8px 14px">&larr; Games</a>

  <div id="wrap">
    <aside id="left">
      <div class="panel">
        <div class="lbl">Score</div>
        <div class="val" id="score">0</div>
        <div class="lbl">Best</div>
        <div class="val small" id="best">0</div>
      </div>
      <div class="panel hint-panel">
        <div class="lbl">How</div>
        <p class="hint">Aim with the mouse, click to drop. Two of a kind squish into the next fruit. Don't overflow the jar!</p>
      </div>
    </aside>

    <canvas id="game" width="540" height="720"></canvas>

    <aside id="right">
      <div class="panel">
        <div class="lbl">Next</div>
        <canvas id="next" width="86" height="86"></canvas>
      </div>
      <div class="panel">
        <div class="lbl">The Preserves</div>
        <canvas id="chain" width="86" height="356"></canvas>
      </div>
    </aside>
  </div>

  <div id="overScreen" class="overlay hidden">
    <div class="card">
      <h2>The jar overflowed!</h2>
      <div class="big" id="finalScore">0</div>
      <p id="overBest"></p>
      <button class="btn" id="againBtn">New jar ▸</button>
    </div>
  </div>

<script src="game.js"></script>
</body>
</html>
