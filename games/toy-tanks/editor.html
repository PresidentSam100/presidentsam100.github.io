<!DOCTYPE html>
<html lang="en" data-esc-leaves="off"><!-- an editor: Esc would throw away work (Home still leaves) -->
<head>
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ctext%20y%3D%220.9em%22%20font-size%3D%2288%22%3E%F0%9F%92%A5%3C%2Ftext%3E%3C%2Fsvg%3E" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Toy Tanks: build a mission | Sam Lu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Paytone+One&amp;display=swap" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="editor.css" />
<script src="../motion-toggle.js"></script>
<script src="../mute-toggle.js"></script>
<script src="../game-shell.js"></script>
    <meta name="description" content="Build your own Toy Tanks mission: blocks, cork, holes and any of the nine enemy tanks. Test it, save it, or share it as a link." />
    <meta name="author" content="Sam Lu" />
</head>
<body class="editor">
<a href="../" class="nav-back-games" aria-label="Back to games">&larr; Games</a>

<main id="ed">
  <header class="ed-head">
    <h1 class="ed-title">Toy Tanks</h1>
    <p class="ed-sub">Build a mission</p>
  </header>

  <!-- the arena being built (and, in a test, played) -->
  <section class="ed-boardcol">
    <canvas id="ed-board" width="644" height="504" aria-label="The arena you're building: click or drag to paint, right-click to clear"></canvas>
    <p class="ed-status" id="ed-status" role="status" aria-live="polite"></p>
    <div class="ed-testbar" id="ed-testbar" hidden>
      <span id="ed-test-line">Testing</span>
      <button type="button" class="ghost" id="ed-stop">Stop</button>
    </div>
    <!-- a test on a touch screen: the game's sticks and Mine button -->
    <div id="pad">
      <div class="stick" id="move-stick" aria-label="Drive"><i></i><span>Drive</span></div>
      <button type="button" id="mine-btn" aria-label="Lay a mine">Mine</button>
      <div class="stick aim" id="aim-stick" aria-label="Aim, and let go to fire"><i></i><span>Aim &amp; fire</span></div>
    </div>
  </section>

  <!-- the tools -->
  <aside class="ed-side">
    <h2>Paint</h2>
    <div class="ed-palette" id="ed-palette" role="toolbar" aria-label="What to paint"></div>
    <p class="ed-what" id="ed-what"></p>

    <label class="ed-field">Name <input type="text" id="ed-name" maxlength="40" placeholder="My mission" autocomplete="off" /></label>

    <div class="ed-row">
      <button type="button" class="playbtn" id="ed-test">Test</button>
      <button type="button" class="ghost" id="ed-check">Check</button>
      <button type="button" class="ghost" id="ed-save">Save</button>
      <button type="button" class="ghost" id="ed-savenew" title="Keep the saved mission as it was and save this as another" hidden>Save as new</button>
      <button type="button" class="ghost" id="ed-new">New</button>
    </div>
    <div class="ed-row">
      <button type="button" class="ghost" id="ed-play">Play in the game</button>
      <button type="button" class="ghost" id="ed-share">Copy share link</button>
      <button type="button" class="ghost" id="ed-export">Export</button>
      <button type="button" class="ghost" id="ed-import">Import</button>
    </div>

    <h2>My missions</h2>
    <div class="ed-saved" id="ed-saved"></div>

    <a class="ghost ed-back" id="ed-back" href="./" data-leave>Back to the game</a>
  </aside>
</main>

<!-- export and import -->
<section class="panel" id="ed-io" hidden>
  <div class="card">
    <h2 id="ed-io-title">Export</h2>
    <textarea id="ed-io-text" spellcheck="false" aria-label="The mission as text"></textarea>
    <p class="ed-io-note" id="ed-io-note"></p>
    <div class="row">
      <button type="button" class="playbtn" id="ed-io-load" hidden>Load into the editor</button>
      <button type="button" class="ghost" id="ed-io-copy">Copy</button>
      <button type="button" class="ghost" id="ed-io-close">Close</button>
    </div>
  </div>
</section>

<!-- the end of a test -->
<section class="panel" id="ed-over" hidden>
  <div class="card">
    <h2 id="ed-over-title">Mission cleared!</h2>
    <p class="stats" id="ed-over-msg"></p>
    <div class="row">
      <button type="button" class="playbtn" id="ed-done">Back to editing</button>
      <button type="button" class="ghost" id="ed-again">Test again</button>
    </div>
  </div>
</section>

<script src="engine.js"></script>
<script src="levelcode.js"></script>
<script src="art.js"></script>
<script src="editor.js"></script>
</body>
</html>
