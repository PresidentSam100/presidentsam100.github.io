<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sunset Slice</title>
    <link rel="stylesheet" href="styles.css" />
<script src="../motion-toggle.js"></script>
<script src="../mute-toggle.js"></script>
<script src="../game-shell.js"></script>
    <meta name="description" content="Sunset Slice — swipe to cut what the wind throws up against the setting sun. Don't cut the bombs. A browser game by Sam Lu." />
    <meta property="og:title" content="Sunset Slice — Sam Lu" />

<body>
<a href="../" class="nav-back-games" aria-label="Back to games">&larr; Games</a>

<!-- The whole scene is one canvas (art.js draws it, game.js runs it). The
     panels on top pass pointer events through, except their buttons, so a
     swipe anywhere reaches the canvas. -->
<canvas id="stage" aria-label="A sunset: swipe across the flying targets to cut them"></canvas>

<div class="hud" id="hud" hidden>
  <div class="score" id="hud-score">0</div>
  <div id="hud-sub"></div>
  <button type="button" class="pause-btn" id="pause-btn" aria-label="Pause (P or Esc)" title="Pause (P / Esc)" aria-keyshortcuts="P Escape">❚❚</button>
</div>

<section class="panel menu" id="menu">
  <h1>Sunset Slice</h1>
  <p class="tag">Cut what the wind throws up. Never the bombs.</p>
  <p class="how">Swipe across a target to choose a mode <span class="desk">(hold the mouse button and drag)</span></p>
  <div class="modes">
    <button type="button" data-mode="duel"><b>Duel</b><small>three seals: every target you let fall costs one; a bomb ends it</small></button>
    <button type="button" data-mode="lastlight"><b>Last Light</b><small>60 seconds while the sun goes down; a bomb costs 10</small></button>
    <button type="button" data-mode="calm"><b>Calm</b><small>90 seconds, no bombs</small></button>
  </div>
  <p class="bests" id="bests"></p>
</section>

<section class="panel over" id="over" hidden>
  <h2 id="over-title">The sun has set</h2>
  <p class="big" id="over-msg"></p>
  <p class="stats" id="over-stats"></p>
  <div class="row">
    <button type="button" id="again">Again</button>
    <button type="button" id="to-menu">Modes</button>
  </div>
</section>

<section class="panel paused" id="pause" hidden>
  <h2>Paused</h2>
  <p class="stats">The wind holds its breath.</p>
  <div class="row">
    <button type="button" id="resume">Resume</button>
    <button type="button" id="quit">Modes</button>
  </div>
</section>

<script src="art.js"></script>
<script src="game.js"></script>
</body>
</html>
