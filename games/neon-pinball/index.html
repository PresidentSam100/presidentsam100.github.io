<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ctext%20y%3D%220.9em%22%20font-size%3D%2288%22%3E%F0%9F%AA%A9%3C%2Ftext%3E%3C%2Fsvg%3E" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0c0716" />
  <title>Neon Pinball (beta)</title>
    <link rel="stylesheet" href="styles.css" />
  <script src="../motion-toggle.js"></script>
  <script src="../mute-toggle.js"></script>
<script src="../game-shell.js"></script>
    <meta name="description" content="Neon Pinball BETA — physics pinball — bumpers, multiball, tilt. A browser game by Sam Lu." />
    <meta property="og:title" content="Neon Pinball BETA — Sam Lu" />
    <meta property="og:type" content="website" />
    <meta property="og:description" content="Neon Pinball BETA — physics pinball — bumpers, multiball, tilt. A browser game by Sam Lu." />
    <meta name="twitter:card" content="summary" />
    <meta name="author" content="Sam Lu" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-H1K8QYFCV5"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag("js", new Date());
      gtag("config", "G-H1K8QYFCV5");
    </script>
</head>
<body>
<a href="../" class="nav-back-games" aria-label="Back to games" style="position:fixed;top:12px;left:12px;z-index:99999;text-decoration:none;font:700 12px/1 'Orbitron',system-ui,sans-serif;letter-spacing:.5px;color:#36f5ff;background:rgba(10,6,24,.85);border:1px solid #36f5ff;border-radius:6px;padding:8px 12px;box-shadow:0 0 12px rgba(54,245,255,.4)">&larr; Games</a>

  <div class="stage">
    <div class="hud">
      <div class="cell"><div class="lbl">SCORE</div><div class="val" id="score">0</div></div>
      <div class="cell"><div class="lbl">BALL</div><div class="val" id="balls">1</div></div>
      <div class="cell"><div class="lbl">MULT</div><div class="val" id="mult">x1</div></div>
      <div class="cell"><div class="lbl">BEST</div><div class="val" id="best">0</div></div>
    </div>
    <div class="lamps">
      <span class="lamp save" id="lampSave">BALL&nbsp;SAVE</span>
      <span class="lamp mb" id="lampMb">MULTIBALL</span>
      <span class="lamp tilt" id="lampTilt">TILT</span>
    </div>

    <div class="wrap">
      <canvas id="pf" width="440" height="760" aria-label="Pinball playfield"></canvas>
      <div id="ticker"></div>
      <button id="launchBtn">⟰ LAUNCH</button>
      <div class="flip-hint" id="flipHint"></div>
    </div>
  </div>

  <!-- Start / table select -->
  <div class="overlay" id="startScreen">
    <div class="card">
      <div class="title" style="font-size:clamp(30px,9vw,56px)">NEON PINBALL</div>
      <div style="margin-top:6px;"><span style="display:inline-block;font-size:11px;font-weight:800;letter-spacing:3px;color:#ffd23f;border:1px solid #ffd23f;border-radius:999px;padding:2px 11px;box-shadow:0 0 10px rgba(255,210,63,.35)">BETA</span></div>
      <p class="sub" style="margin:10px 0 12px;">Pick a table.</p>
      <div class="modes">
        <button class="mode-card" data-mode="classic" style="--mc:#36f5ff">
          <span class="mc-name">CLASSIC FAN</span>
          <span class="mc-desc">Symmetrical neon layout · fan ramps · 3 pop bumpers · side target banks</span>
        </button>
        <button class="mode-card" data-mode="speedway" style="--mc:#b06bff">
          <span class="mc-name">SYNTHWAVE SPEEDWAY</span>
          <span class="mc-desc">Fast &amp; asymmetrical · upper-right flipper · neon mega-ramp · long orbit</span>
        </button>
        <button class="mode-card" data-mode="tactical" style="--mc:#46e6a0">
          <span class="mc-name">CYBER-NOIR TACTICAL</span>
          <span class="mc-desc">Dense stop-and-go · scoops &amp; ball locks · drop banks · mini upper playfield</span>
        </button>
      </div>
      <p class="big" style="font-size:11px;margin:2px 0;">◂/A · ▸/L flippers &nbsp;·&nbsp; hold Space to launch &nbsp;·&nbsp; Z/M nudge</p>
      <p class="big" id="startBest" style="margin-top:6px;"></p>
    </div>
  </div>

  <!-- Game over -->
  <div class="overlay hidden" id="overScreen">
    <div class="card">
      <div class="title" style="font-size:clamp(28px,9vw,52px)">GAME OVER</div>
      <div class="final" id="finalScore">0</div>
      <p class="big" id="overBest"></p>
      <button class="btn" id="againBtn" style="margin-top:16px;">PLAY AGAIN</button>
      <button class="btn ghost" id="modesBtn" style="margin-top:10px;background:transparent;color:var(--muted);box-shadow:none;border:1px solid var(--line);font-size:13px;padding:10px 24px;">⟲ CHANGE TABLE</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
