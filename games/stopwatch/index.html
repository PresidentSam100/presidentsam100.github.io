<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ctext%20y%3D%220.9em%22%20font-size%3D%2288%22%3E%E2%8F%B1%EF%B8%8F%3C%2Ftext%3E%3C%2Fsvg%3E" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Stopwatch — Sam Lu</title>
  <meta name="description" content="Stop the hidden clock as close to the target as you can. A precision timing game by Sam Lu." />

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-H1K8QYFCV5"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag("js", new Date());
    gtag("config", "G-H1K8QYFCV5");
  </script>

    <link rel="stylesheet" href="styles.css" />
<script src="../motion-toggle.js"></script>
<script src="../mute-toggle.js"></script>
    <meta property="og:title" content="Stopwatch — Sam Lu" />
    <meta property="og:type" content="website" />
    <meta property="og:description" content="Stopwatch — stop the hidden clock on the target time. A browser game by Sam Lu." />
    <meta name="twitter:card" content="summary" />
    <meta name="author" content="Sam Lu" />
</head>
<body>
  <a href="../" class="nav-back-games" aria-label="Back to games" style="position:fixed;top:12px;left:12px;z-index:99999;text-decoration:none;font:700 14px/1 'Varela Round',system-ui,sans-serif;color:#b8323d;background:#fffaf0;border:2px solid #e8505b;border-radius:999px;box-shadow:0 3px 0 #c43c47;padding:7px 14px">&larr; Games</a>

  <div class="wrap">
    <header class="top">
      <h1>Stopwatch</h1>
      <p>bake every tray to the second &middot; stop the clock right on the target</p>
    </header>

    <div class="hud">
      <div class="stat"><div class="label">Baked</div><div class="value" id="score">0</div></div>
      <div class="stat"><div class="label">Round</div><div class="value" id="round">—</div></div>
      <div class="stat"><div class="label">Best</div><div class="value" id="best">0</div></div>
    </div>

    <div class="budget">
      <div class="row"><span>Error budget used</span><span><b id="used">0.000</b> / 1.000 s</span></div>
      <div class="meter"><span id="meter-fill"></span></div>
      <div class="row" style="margin-top:0.32rem;"><span>Margin remaining</span><b id="margin">1.000 s</b></div>
    </div>

    <!-- the whole stage is the tap target (game.js). data-phase / data-bake /
         data-mode on it drive the oven: see styles.css -->
    <div class="stage" data-phase="idle">
      <div class="oven">
        <div class="oven-top">
          <div class="display">
            <div class="target-line" id="target-line">get ready…</div>
            <div class="target-big" id="target-big">—</div>
          </div>
          <span class="knob" aria-hidden="true"></span><span class="knob" aria-hidden="true"></span>
        </div>
        <div class="oven-body">
          <div class="door" aria-hidden="true">
            <div class="window"><div class="tray"><i class="cookie"></i><i class="cookie"></i><i class="cookie"></i><i class="cookie"></i></div></div>
            <div class="handle"></div>
          </div>
          <button class="btn-main" id="btn" disabled>START</button>
        </div>
      </div>
      <div class="sub" id="sub">press start to begin</div>
      <div class="result" id="result"></div>
    </div>

    <div class="footer-controls">
      <span class="mode-pill" id="mode-pill"></span>
    </div>
    <p class="hint">tap the oven or press <b>Space</b> — once to put the tray in, again to take it out</p>
  </div>

  <!-- Start / Game over overlay -->
  <div class="overlay show" id="overlay-card">
    <div class="card" id="card-inner"></div>
  </div>

<script src="game.js"></script>
</body>
</html>
