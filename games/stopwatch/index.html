<html lang="en">
<head>

  <meta name="description" content="Stop a hunter pocket watch's sweep hand dead on the mark — in Hidden mode the lid snaps shut and you time it blind. A precision game by Sam Lu." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
<script src="../motion-toggle.js"></script>
<script src="../mute-toggle.js"></script>
    <meta property="og:title" content="Stopwatch — Sam Lu" />
    <meta property="og:type" content="website" />
    <meta property="og:description" content="Stopwatch — stop the hunter watch's sweep hand dead on the mark; Hidden mode shuts the lid. A browser game by Sam Lu." />
    <meta name="twitter:card" content="summary" />
    <meta name="author" content="Sam Lu" />
</head>
<body>
  <a href="../" class="nav-back-games" aria-label="Back to games">&larr; Games</a>

  <div class="wrap">
    <header class="top">
      <h1>Stopwatch</h1>
      <p>a hunter pocket watch &middot; stop the sweep hand dead on the mark</p>
    </header>

    <div class="hud">
      <div class="stat"><div class="label">Regulated</div><div class="value" id="score">0</div></div>
      <div class="stat"><div class="label">Round</div><div class="value" id="round">—</div></div>
      <div class="stat"><div class="label">Best</div><div class="value" id="best">0</div></div>
    </div>

    <div class="budget">
      <div class="row"><span>Drift on the service card</span><span><b id="used">0.000</b> / 1.000 s</span></div>
      <div class="meter"><span id="meter-fill"></span></div>
      <div class="row" style="margin-top:0.32rem;"><span>Tolerance left</span><b id="margin">1.000 s</b></div>
    </div>

    <!-- the whole stage is the tap target (game.js). data-phase / data-bake /
         data-mode on it drive the watch: see styles.css. The dial, the hand
         and the engraved lid are built into .case by game.js at boot. -->
    <div class="stage" data-phase="idle">
      <div class="watch" aria-hidden="true">
        <span class="bow"></span>
        <span class="crown"></span>
        <div class="case" id="case"></div>
        <span class="chain" aria-hidden="true"></span>
      </div>
      <div class="display">
        <div class="target-line" id="target-line">get ready…</div>
        <div class="target-big" id="target-big">—</div>
      </div>
      <button class="btn-main" id="btn" disabled>START</button>
      <div class="sub" id="sub">press start to begin</div>
      <div class="result" id="result"></div>
    </div>

    <div class="footer-controls">
      <span class="mode-pill" id="mode-pill"></span>
    </div>
    <p class="hint">tap the watch or press <b>Space</b> — once to start the sweep, again to stop it</p>
  </div>

  <!-- Start / Game over overlay -->
  <div class="overlay show" id="overlay-card">
    <div class="card" id="card-inner"></div>
  </div>

<script src="game.js"></script>
</body>
</html>
