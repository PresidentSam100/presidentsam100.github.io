<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ctext%20y%3D%220.9em%22%20font-size%3D%2288%22%3E%F0%9F%9A%A2%3C%2Ftext%3E%3C%2Fsvg%3E" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#07101c" />
  <title>Battleship</title>
    <link rel="stylesheet" href="styles.css" />

  <script src="../motion-toggle.js"></script>
  <script src="../mute-toggle.js"></script>
  <script src="../coinflip.js"></script>
    <meta name="description" content="Battleship — place your fleet, sink the CPU's fleet — 3 AI levels. A browser game by Sam Lu." />
    <meta property="og:title" content="Battleship — Sam Lu" />
    <meta property="og:type" content="website" />
    <meta property="og:description" content="Battleship — place your fleet, sink the CPU's fleet — 3 AI levels. A browser game by Sam Lu." />
    <meta name="twitter:card" content="summary" />
    <meta name="author" content="Sam Lu" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-H1K8QYFCV5"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag("js", new Date());
      gtag("config", "G-H1K8QYFCV5");

</head>
<body>
<a href="../" class="nav-back-games" aria-label="Back to games" style="position:fixed;top:12px;left:12px;z-index:99999;text-decoration:none;font:800 13px/1 'Inter',system-ui,sans-serif;color:#36cfff;background:#0f1f30;border:1px solid #36cfff;border-radius:8px;padding:8px 13px;box-shadow:0 0 12px rgba(54,207,255,.35)">&larr; Games</a>

  <div class="wrap">
    <header class="top"><h1>Battle<b>ship</b></h1></header>
    <div id="status"></div>

    <div class="boards">
      <div class="bcol" id="enemyCol" hidden>
        <h2>Enemy Waters <span id="coord"></span></h2>
        <div class="grid enemy" id="enemyGrid"></div>
        <div class="fleet" id="enemyFleet"></div>
      </div>
      <div class="bcol">
        <h2 id="playerTitle">Your Fleet</h2>
        <div class="grid" id="playerGrid"></div>
        <div class="fleet" id="playerFleet"></div>
      </div>
    </div>

    <div class="controls" id="placeControls">
      <div class="diffrow">
        <span class="lbl2">CPU</span>
        <button class="dbtn" data-diff="easy">Easy</button>
        <button class="dbtn" data-diff="medium">Medium</button>
        <button class="dbtn" data-diff="hard">Hard</button>
      </div>
      <div class="placing" id="placing"></div>
      <button class="btn ghost" id="rotateBtn">⟳ Rotate <small>R</small></button>
      <button class="btn ghost" id="randomBtn">🎲 Random <small>A</small></button>
      <button class="btn ghost" id="resetBtn">↺ Reset <small>⌫</small></button>
      <button class="btn" id="startBtn" disabled>⚓ Start Battle <small>↵</small></button>
    </div>
  </div>

  <div class="overlay hidden" id="over">
    <div class="card">
      <h2 id="overTitle">Victory</h2>
      <p id="overMsg"></p>
      <button class="btn" id="againBtn">New Game</button>
      <div class="record" id="record"></div>
    </div>
  </div>

<script src="game.js"></script>

</body>
</html>
