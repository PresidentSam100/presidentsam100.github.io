<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pong</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #0a0a0a;
    color: #fff;
    font-family: "Segoe UI", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #game {
    background: #000;
    border: 2px solid #fff;
    display: block;
    max-width: 95vw;
    max-height: 95vh;
    touch-action: none; /* drags move paddles, never scroll the page */
  }
  .overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.85);
    text-align: center;
    gap: 20px;
  }
  .overlay h1 {
    font-size: clamp(40px, 10vw, 90px);
    letter-spacing: 12px;
    margin-bottom: 10px;
  }
  .overlay p { opacity: 0.7; max-width: 320px; line-height: 1.5; }
  .btn {
    font: inherit;
    font-size: 22px;
    padding: 14px 40px;
    min-width: 240px;
    background: #fff;
    color: #000;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: transform 0.08s, background 0.15s;
  }
  .btn:hover { background: #ccc; transform: scale(1.04); }
  .hidden { display: none; }
</style>
</head>
<body>
<canvas id="game" width="800" height="500"></canvas>

<div id="menu" class="overlay">
  <h1>PONG</h1>
  <button class="btn" data-mode="1">1 Player</button>
  <button class="btn" data-mode="2">2 Players</button>
  <p id="controls"></p>
</div>

<div id="gameover" class="overlay hidden">
  <h1 id="winner"></h1>
  <button class="btn" id="again">Play Again</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = canvas.width;
const H = canvas.height;

const PADDLE_W = 12;
const PADDLE_H = 90;
const PADDLE_SPEED = 7;
const BALL_SIZE = 12;
const WIN_SCORE = 7;

const menu = document.getElementById("menu");
const gameover = document.getElementById("gameover");
const winnerEl = document.getElementById("winner");
const controlsEl = document.getElementById("controls");

let state = "menu";     // "menu" | "playing" | "gameover"
let players = 1;        // 1 = vs AI, 2 = vs human

// --- Sound (Web Audio API, no files needed) ---
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  }
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
}

// Play a single tone. type/freq/duration shape the sound.
function tone(freq, duration, type = "square", volume = 0.2, startAt = 0) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime + startAt;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  gain.gain.setValueAtTime(volume, t);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + duration);
}

function fanfare(notes) {
  notes.forEach((f, i) => tone(f, 0.18, "triangle", 0.22, i * 0.13));
}

const sounds = {
  paddleLeft: () => tone(440, 0.08, "square"),
  paddleRight: () => tone(330, 0.08, "square"),
  wall: () => tone(220, 0.06, "sine", 0.12),
  // Player 1 (left) point: brighter ascending blip
  scoreLeft: () => { tone(294, 0.16, "sawtooth", 0.18); tone(392, 0.2, "sawtooth", 0.16, 0.05); },
  // Player 2 (right) point: lower descending blip
  scoreRight: () => { tone(196, 0.18, "sawtooth", 0.18); tone(147, 0.22, "sawtooth", 0.16, 0.05); },
  // Player 1 (left) win: C major  C-E-G-C
  winLeft: () => fanfare([523, 659, 784, 1047]),
  // Player 2 (right, CPU or human) win: D major  D-F#-A-D
  winRight: () => fanfare([587, 740, 880, 1175]),
};

const left = { x: 20, y: H / 2 - PADDLE_H / 2, score: 0 };
const right = { x: W - 20 - PADDLE_W, y: H / 2 - PADDLE_H / 2, score: 0 };
const ball = { x: W / 2, y: H / 2, vx: 0, vy: 0 };

const keys = {};
document.addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true;
  // stop page scrolling on arrows
  if (["arrowup", "arrowdown"].includes(e.key.toLowerCase())) e.preventDefault();
});
document.addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });

// --- Touch controls: drag on your half of the screen to move that paddle ---
let leftTarget = null, rightTarget = null;
function handleTouches(e) {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  let lT = null, rT = null;
  for (const t of e.touches) {
    const x = (t.clientX - rect.left) / rect.width * W;
    const y = (t.clientY - rect.top) / rect.height * H;
    if (x < W / 2) lT = y; else rT = y;
  }
  leftTarget = lT;
  rightTarget = rT;
}
canvas.addEventListener("touchstart", e => { initAudio(); handleTouches(e); }, { passive: false });
canvas.addEventListener("touchmove", handleTouches, { passive: false });
canvas.addEventListener("touchend", handleTouches, { passive: false });
canvas.addEventListener("touchcancel", handleTouches, { passive: false });

function resetBall(dir) {
  ball.x = W / 2;
  ball.y = H / 2;
  const angle = (Math.random() * 0.5 - 0.25) * Math.PI; // -45deg..45deg
  const speed = 6;
  ball.vx = dir * speed * Math.cos(angle);
  ball.vy = speed * Math.sin(angle);
}

function startGame(mode) {
  initAudio(); // unlock/resume audio on user gesture
  players = mode;
  left.score = 0;
  right.score = 0;
  left.y = right.y = H / 2 - PADDLE_H / 2;
  resetBall(Math.random() < 0.5 ? -1 : 1);
  state = "playing";
  menu.classList.add("hidden");
  gameover.classList.add("hidden");
}

function clampPaddle(p) {
  if (p.y < 0) p.y = 0;
  if (p.y + PADDLE_H > H) p.y = H - PADDLE_H;
}

function update() {
  if (state !== "playing") return;

  // Left paddle: touch drag, else W / S
  if (leftTarget !== null) {
    left.y = leftTarget - PADDLE_H / 2;
  } else {
    if (keys["w"]) left.y -= PADDLE_SPEED;
    if (keys["s"]) left.y += PADDLE_SPEED;
  }
  clampPaddle(left);

  // Right paddle: human (touch drag / arrows) or AI
  if (players === 2) {
    if (rightTarget !== null) {
      right.y = rightTarget - PADDLE_H / 2;
    } else {
      if (keys["arrowup"]) right.y -= PADDLE_SPEED;
      if (keys["arrowdown"]) right.y += PADDLE_SPEED;
    }
  } else {
    const target = ball.y - PADDLE_H / 2;
    const diff = target - right.y;
    const aiSpeed = PADDLE_SPEED * 0.82; // slightly beatable
    if (Math.abs(diff) > aiSpeed) right.y += Math.sign(diff) * aiSpeed;
    else right.y = target;
  }
  clampPaddle(right);

  // Ball movement
  ball.x += ball.vx;
  ball.y += ball.vy;

  // Top / bottom walls
  if (ball.y < 0) { ball.y = 0; ball.vy *= -1; sounds.wall(); }
  if (ball.y + BALL_SIZE > H) { ball.y = H - BALL_SIZE; ball.vy *= -1; sounds.wall(); }

  // Paddle collisions
  collide(left, 1);
  collide(right, -1);

  // Scoring
  if (ball.x + BALL_SIZE < 0) { right.score++; afterPoint(1); }
  else if (ball.x > W) { left.score++; afterPoint(-1); }
}

function collide(p, dir) {
  if (
    ball.x < p.x + PADDLE_W &&
    ball.x + BALL_SIZE > p.x &&
    ball.y < p.y + PADDLE_H &&
    ball.y + BALL_SIZE > p.y
  ) {
    // reflect and add english based on hit position
    const hit = (ball.y + BALL_SIZE / 2 - (p.y + PADDLE_H / 2)) / (PADDLE_H / 2);
    const speed = Math.min(Math.hypot(ball.vx, ball.vy) * 1.05, 14);
    const angle = hit * (Math.PI / 4); // up to 45deg
    ball.vx = dir * speed * Math.cos(angle);
    ball.vy = speed * Math.sin(angle);
    // nudge out so it doesn't stick
    ball.x = dir === 1 ? p.x + PADDLE_W : p.x - BALL_SIZE;
    if (dir === 1) sounds.paddleLeft(); else sounds.paddleRight();
  }
}

function afterPoint(dir) {
  if (left.score >= WIN_SCORE || right.score >= WIN_SCORE) {
    state = "gameover";
    let who;
    if (players === 1) who = left.score > right.score ? "You Win!" : "CPU Wins!";
    else who = left.score > right.score ? "Left Wins!" : "Right Wins!";
    winnerEl.textContent = who;
    gameover.classList.remove("hidden");
    if (left.score > right.score) sounds.winLeft(); else sounds.winRight();
    return;
  }
  if (dir === -1) sounds.scoreLeft(); else sounds.scoreRight();
  resetBall(dir);
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // center dashed line
  ctx.strokeStyle = "rgba(255,255,255,0.4)";
  ctx.lineWidth = 4;
  ctx.setLineDash([12, 16]);
  ctx.beginPath();
  ctx.moveTo(W / 2, 0);
  ctx.lineTo(W / 2, H);
  ctx.stroke();
  ctx.setLineDash([]);

  // scores
  ctx.fillStyle = "#fff";
  ctx.font = "48px 'Segoe UI', sans-serif";
  ctx.textAlign = "center";
  ctx.fillText(left.score, W / 2 - 60, 60);
  ctx.fillText(right.score, W / 2 + 60, 60);

  // paddles
  ctx.fillRect(left.x, left.y, PADDLE_W, PADDLE_H);
  ctx.fillRect(right.x, right.y, PADDLE_W, PADDLE_H);

  // ball
  ctx.fillRect(ball.x, ball.y, BALL_SIZE, BALL_SIZE);
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// Menu wiring
document.querySelectorAll("#menu .btn").forEach(b => {
  b.addEventListener("click", () => startGame(Number(b.dataset.mode)));
});
document.getElementById("again").addEventListener("click", () => {
  state = "menu";
  gameover.classList.add("hidden");
  menu.classList.remove("hidden");
});

controlsEl.textContent =
  "Desktop: W/S (left) · ↑/↓ arrows (right, 2P).  Mobile: drag on your half of the screen.  First to " + WIN_SCORE + " wins.";

loop();
</script>
</body>
</html>
