<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pong</title>
    <link rel="stylesheet" href="styles.css" />
<script src="../motion-toggle.js"></script>
<script src="../mute-toggle.js"></script>
<script src="../game-shell.js"></script>
    <meta name="description" content="Pong — the original paddle classic. A browser game by Sam Lu." />
    <meta property="og:title" content="Pong — Sam Lu" />
    <meta property="og:type" content="website" />
    <meta property="og:description" content="Pong — the original paddle classic. A browser game by Sam Lu." />
    <meta name="twitter:card" content="summary" />
    <meta name="author" content="Sam Lu" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-H1K8QYFCV5"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }

<body>
<a href="../" class="nav-back-games" aria-label="Back to games" style="position:fixed;top:12px;left:12px;z-index:99999;text-decoration:none;font:700 12px/1 'Segoe UI',system-ui,sans-serif;letter-spacing:1px;color:#000;background:#fff;border:none;border-radius:6px;padding:8px 13px">&larr; Games</a>
<canvas id="game" width="800" height="500"></canvas>

<div id="menu" class="overlay">
  <h1>PONG</h1>
  <button class="btn" data-mode="1">1 Player</button>
  <button class="btn" data-mode="2">2 Players</button>
  <p id="controls">
    <span class="ctrl-desktop">Desktop: W/S (left) · ↑/↓ arrows (right, 2P).</span>
    <span class="ctrl-mobile">Mobile: on-screen ▲ ▼ buttons.</span>
    <span class="ctrl-win"></span>
  </p>
</div>

<div id="gameover" class="overlay hidden">
  <h1 id="winner"></h1>
  <p id="record" style="margin:0 0 .6rem;opacity:.75;font-size:.9rem"></p>
  <button class="btn" id="again">Play Again</button>
</div>

<div id="countdown" class="overlay hidden">
  <div class="count-num" id="count-num">3</div>
  <div class="count-controls">
    <div><b id="count-left-label">Player 1</b><span id="count-left">W / S</span></div>
    <div><b id="count-right-label">Player 2</b><span id="count-right">↑ / ↓</span></div>
  </div>
</div>

<!-- On-screen paddle controls (mobile) -->
<div id="ctrl-left" class="pong-ctrl">
  <button class="pbtn" data-side="left" data-dir="up" aria-label="Left paddle up">▲</button>
  <button class="pbtn" data-side="left" data-dir="down" aria-label="Left paddle down">▼</button>
</div>
<div id="ctrl-right" class="pong-ctrl">
  <button class="pbtn" data-side="right" data-dir="up" aria-label="Right paddle up">▲</button>
  <button class="pbtn" data-side="right" data-dir="down" aria-label="Right paddle down">▼</button>
</div>

<script src="game.js"></script>
</body>
</html>
