<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ctext%20y%3D%220.9em%22%20font-size%3D%2288%22%3E%F0%9F%96%B1%EF%B8%8F%3C%2Ftext%3E%3C%2Fsvg%3E" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#aee0ff" />
  <title>ClickTap — speed test</title>
    <link rel="stylesheet" href="styles.css" />
  <script src="../motion-toggle.js"></script>
  <script src="../mute-toggle.js"></script>
    <meta name="description" content="ClickTap — clicks/taps-per-second speed test. A browser game by Sam Lu." />
    <meta property="og:title" content="ClickTap — Sam Lu" />
    <meta property="og:type" content="website" />
    <meta property="og:description" content="ClickTap — clicks/taps-per-second speed test. A browser game by Sam Lu." />
    <meta name="twitter:card" content="summary" />
    <meta name="author" content="Sam Lu" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-H1K8QYFCV5"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag("js", new Date());
      gtag("config", "G-H1K8QYFCV5");
    </script>
</head>
<body>
<a href="../" class="nav-back-games" aria-label="Back to games" style="position:fixed;top:12px;left:12px;z-index:99999;text-decoration:none;font:700 14px/1 'Baloo 2',system-ui,sans-serif;color:#2e5b22;background:#fffaf0;border:2px solid #9cc27a;border-radius:12px;box-shadow:0 3px 0 #7fae5c;padding:7px 12px">&larr; Games</a>

  <div class="wrap">
    <header class="top">
      <h1>Click<b>Tap</b></h1>
      <p id="subtitle">how fast can you click?</p>
    </header>

    <!-- SETUP -->
    <section id="setup">
      <div style="text-align:center;display:flex;flex-direction:column;gap:.5rem;align-items:center;">
        <span class="lbl">Duration</span>
        <div class="choices" id="durChoices">
          <button class="choice" data-dur="3">3s</button>
          <button class="choice sel" data-dur="5">5s</button>
          <button class="choice" data-dur="10">10s</button>
        </div>
      </div>
      <button class="btn" id="startBtn">START</button>
      <p class="best" id="setupBest"></p>
    </section>

    <!-- PLAY -->
    <section id="play" hidden>
      <div class="hud">
        <div class="stat"><div class="k">Time</div><div class="v" id="vTime">5.0</div></div>
        <div class="stat"><div class="k" id="kClicks">Clicks</div><div class="v" id="vClicks">0</div></div>
        <div class="stat"><div class="k" id="kCps">CPS</div><div class="v" id="vCps">0.0</div></div>
      </div>
      <div class="pad-wrap">
        <svg class="ring" viewBox="0 0 200 200"><circle class="bg" cx="100" cy="100" r="92"></circle><circle class="fg" id="ringFg" cx="100" cy="100" r="92"></circle></svg>
        <div class="pad" id="pad">
          <div class="bed" id="bed" aria-hidden="true"></div>
          <div class="sign"><div class="big" id="padCount">GO</div><div class="small" id="padSub"></div></div>
        </div>
      </div>
      <p class="hint" id="hint"></p>
      <button class="btn ghost" id="quitBtn">Cancel</button>
    </section>

    <!-- RESULT -->
    <section id="result" hidden>
      <div class="harvest" id="harvest" aria-hidden="true"></div>
      <div class="final"><span id="finalCps">0.0</span> <small id="finalUnit">CPS</small></div>
      <div class="rating" id="rating"></div>
      <div class="newbest" id="newBest"></div>
      <div class="summary" id="summary"></div>
      <div class="graph" id="graph"></div>
      <div class="row" style="margin-top:.4rem;">
        <button class="btn" id="againBtn">AGAIN</button>
        <button class="btn ghost" id="settingsBtn">⚙ Settings</button>
      </div>
    </section>
  </div>

<script src="game.js"></script>
</body>
</html>
