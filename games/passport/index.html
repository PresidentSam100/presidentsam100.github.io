<!-- The open passport on a customs desk. Left page: the flag postcard and
     the four destination tags. Right page: your stamps. -->
<main id="desk">
  <div class="booklet" id="booklet">
    <section class="page page-l">
      <div class="hudline">
        <span id="hud-mode"></span>
        <span id="hud-score">0 stamps</span>
        <span id="hud-extra"></span>
      </div>
      <figure class="postcard" id="postcard">
        <img id="flag" alt="A country's flag" draggable="false" />
        <figcaption id="post-cap">whose flag is this?</figcaption>
      </figure>
      <div class="tags" id="tags">
        <button type="button" class="tag" data-i="0"><kbd>1</kbd><span></span></button>
        <button type="button" class="tag" data-i="1"><kbd>2</kbd><span></span></button>
        <button type="button" class="tag" data-i="2"><kbd>3</kbd><span></span></button>
        <button type="button" class="tag" data-i="3"><kbd>4</kbd><span></span></button>
      </div>
      <form class="typed" id="typed" hidden autocomplete="off">
        <label for="answer">STATE / ÉTAT</label>
        <div class="typed-row">
          <input id="answer" type="text" maxlength="40" autocomplete="off"
                 autocapitalize="off" autocorrect="off" spellcheck="false"
                 placeholder="type the country…" aria-label="Type the country's name" />
          <button type="submit" id="stamp-btn">Stamp <kbd>Enter</kbd></button>
        </div>
        <div class="typed-note" id="typed-note">one small typo is forgiven · common names count (UK, Burma…)</div>
      </form>
    </section>
    <section class="page page-r">
      <div class="page-head">ENTRIES · VISAS</div>
      <div class="stamps" id="stamps"></div>
      <div class="big-stamp" id="big-stamp" hidden></div>
    </section>
  </div>
</main>

<section class="panel" id="menu">
  <div class="card">
    <h1>Passport</h1>
    <p class="tag-line">the flag quiz at the border desk</p>
    <p class="how">
      One flag, four destinations — pick the right country and the officer
      stamps you through. Guess wrong and the page gets a red
      <b>DENIED</b>.
    </p>
    <div class="pick">
      <div class="seg" id="pick-mode">
        <button type="button" data-v="tour"><b>World Tour</b><small>endless — three denials end it <kbd>1</kbd></small></button>
        <button type="button" data-v="dash"><b>Layover Dash</b><small>60 seconds, wrong costs 3 <kbd>2</kbd></small></button>
        <button type="button" data-v="daily"><b>Visa Run</b><small id="daily-small">today's 10 flags, shareable <kbd>3</kbd></small></button>
      </div>
      <div class="seg styles" id="pick-style">
        <button type="button" data-s="tags"><b>🏷 Tags</b><small>pick from four <kbd>T</kbd></small></button>
        <button type="button" data-s="typed"><b>⌨ Typed</b><small>spell it out <kbd>Y</kbd></small></button>
      </div>
    </div>
    <button type="button" class="playbtn" id="play"><b>Approach the desk</b> <kbd>Enter</kbd></button>
    <p class="bests" id="bests"></p>
  </div>
</section>

<section class="panel" id="over" hidden>
  <div class="card">
    <h2 id="over-title">Trip over</h2>
    <p class="big" id="over-msg"></p>
    <p class="stats" id="over-stats"></p>
    <div class="row">
      <button type="button" id="again">Travel again <kbd>Enter</kbd></button>
      <button type="button" id="share" hidden>Share result</button>
      <button type="button" id="to-menu">Modes <kbd>Esc</kbd></button>
    </div>
  </div>
</section>

<script src="data.js"></script>
<script src="game.js"></script>
</body>
</html>
