      <div class="stat"><div class="label">DIST</div><div class="value" id="value-dist">0</div></div>

      <div class="stat"><div class="label">BEST</div><div class="value" id="value-best">0</div></div>
    </div>

    <div class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div class="overlay show" id="overlay"><div class="card" id="card"></div></div>
    </div>

    <p class="hint">← → or A / D to switch lanes &nbsp;·&nbsp; on mobile, tap the left or right side</p>
  </div>
