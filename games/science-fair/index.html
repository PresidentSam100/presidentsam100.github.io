<body>
<a href="../" class="nav-back-games" aria-label="Back to games">&larr; Games</a>

<!-- The corkboard diorama. game.js hangs the planets from the ruler,
     each one a real <button>, and flies the paper rocket between them. -->
<div id="board" aria-label="A corkboard solar system; repeat the sequence the planets play">
  <div id="ruler" aria-hidden="true"></div>
  <div id="wire" aria-hidden="true" hidden></div>
  <div id="planets"></div>
  <div id="asteroids" aria-hidden="true"></div>
  <div id="ship" aria-hidden="true"></div>
</div>

<!-- An index card pinned up top keeps score. -->
<div class="hud paper-card" id="hud" hidden>
  <div id="hud-round">Round 1</div>
  <div id="hud-say">watch…</div>
</div>

<section class="panel" id="menu">
  <div class="sheet">
    <h1>THE SOLAR SYSTEM</h1>
    <p class="byline">a memory experiment · by&nbsp;Sam, grade&nbsp;4</p>
    <p class="how">
      The planets play a tune, one note longer every round — <b>repeat it</b> by
      tapping them or pressing their number keys (<kbd>1</kbd>–<kbd>9</kbd>). One wrong planet and the
      project falls off the board.
    </p>
    <div class="pick">
      <div class="seg" id="pick-mode">
        <button type="button" data-v="classic"><b>Classic</b><small>the 4 rocky planets <kbd>1</kbd></small></button>
        <button type="button" data-v="grand"><b>Grand Tour</b><small>all 9 cutouts <kbd>2</kbd></small></button>
        <button type="button" data-v="daily"><b>Field Trip</b><small id="daily-small">today's tune · 3 launches <kbd>3</kbd></small></button>
      </div>
    </div>
    <button type="button" class="playbtn" id="play"><b>Blast off</b> <kbd>Enter</kbd></button>
    <p class="bests" id="bests"></p>
  </div>
</section>

<section class="panel" id="over" hidden>
  <div class="sheet rubric">
    <h2 id="over-title">Project review</h2>
    <p class="big" id="over-msg"></p>
    <div class="grade" id="over-grade" aria-hidden="true"></div>
    <p class="stats" id="over-stats"></p>
    <div class="row">
      <button type="button" id="again">Again <kbd>Enter</kbd></button>
      <button type="button" id="share" hidden>Share result</button>
      <button type="button" id="to-menu">Modes <span class="gs-keys"><kbd title="Backspace">⌫</kbd></span></button>
    </div>
  </div>
</section>

<script src="art.js"></script>
<script src="game.js"></script>
</body>
</html>
