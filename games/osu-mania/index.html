<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ctext%20y%3D%220.9em%22%20font-size%3D%2288%22%3E%F0%9F%8E%B5%3C%2Ftext%3E%3C%2Fsvg%3E" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#140a1e" />
  <title>Osu!Mania — 4K score attack</title>
  <meta name="author" content="Sam Lu" />
  <meta name="description" content="Osu!Mania-style 4-key mania — notes fall down four lanes, hit them with your own keybinds (default F G H J). How many can you catch in 30 seconds?" />
    <link rel="stylesheet" href="styles.css" />
  <script src="../motion-toggle.js"></script>
  <script src="../mute-toggle.js"></script>
<script src="../game-shell.js"></script>
    <meta property="og:title" content="Osu!Mania — Sam Lu" />
    <meta property="og:type" content="website" />
    <meta property="og:description" content="Osu!Mania — 4-key mania — hit the notes, remap your own keys. A browser game by Sam Lu." />
    <meta name="twitter:card" content="summary" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-H1K8QYFCV5"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag("js", new Date());
      gtag("config", "G-H1K8QYFCV5");

</head>
<body>
<a href="../" class="nav-back-games" aria-label="Back to games" style="position:fixed;top:12px;left:12px;z-index:99999;text-decoration:none;font:800 13px/1 'Inter',system-ui,sans-serif;color:#ff4fa8;background:#2a1330;border:1px solid #ff4fa8;border-radius:8px;padding:8px 13px;box-shadow:0 0 12px rgba(255,79,168,.35)">&larr; Games</a>

  <div class="wrap">
    <header class="top">
      <h1>Osu!<b>Mania</b> 🎵</h1>
      <p id="subtitle">4-key mania — hit the notes as they fall</p>
    </header>

    <!-- SETUP -->
    <section id="setup">
      <div style="text-align:center;display:flex;flex-direction:column;gap:.5rem;align-items:center;">
        <span class="lbl">Mode</span>
        <div class="choices" id="modeChoices">
          <button class="choice sel" data-mode="attack">Score Attack</button>
          <button class="choice" data-mode="precision">Precision</button>
        </div>
      </div>
      <div style="text-align:center;display:flex;flex-direction:column;gap:.5rem;align-items:center;">
        <span class="lbl">Density</span>
        <div class="choices" id="densityChoices">
          <button class="choice" data-density="sparse" title="Fewer tiles on screen — more time to react">Sparse</button>
          <button class="choice sel" data-density="normal" title="The default pace">Normal</button>
          <button class="choice" data-density="intense" title="Tiles overlap across lanes — quick reflexes needed">Intense</button>
          <button class="choice" data-density="insane" title="As fast as it gets — lanes are almost always full">Insane</button>
        </div>
      </div>
      <div style="text-align:center;display:flex;flex-direction:column;gap:.5rem;align-items:center;">
        <span class="lbl">Duration</span>
        <div class="choices" id="durChoices">
          <button class="choice" data-dur="15">15s</button>
          <button class="choice sel" data-dur="30">30s</button>
          <button class="choice" data-dur="45">45s</button>
        </div>
      </div>
      <div style="text-align:center;display:flex;flex-direction:column;gap:.5rem;align-items:center;">
        <span class="lbl">Keys</span>
        <div class="choices" id="keyBinds">
          <button class="choice keybtn" data-col="0"></button>
          <button class="choice keybtn" data-col="1"></button>
          <button class="choice keybtn" data-col="2"></button>
          <button class="choice keybtn" data-col="3"></button>
        </div>
      </div>
      <button class="btn" id="startBtn">START</button>
      <p class="best" id="setupBest"></p>
      <p class="hint" id="setupHint">click a key above to rebind it — each lane needs a unique key. Pressing a lane with nothing in it counts as a miss!</p>
    </section>

    <!-- PLAY -->
    <section id="play" hidden>
      <div class="hud">
        <div class="stat"><div class="k">Time</div><div class="v" id="vTime">30.0</div></div>
        <div class="stat"><div class="k">Score</div><div class="v" id="vScore">0</div></div>
        <div class="stat"><div class="k">Streak</div><div class="v" id="vStreak">0</div></div>
      </div>
      <div class="timebar"><i id="timeFill"></i></div>
      <div class="board" id="board">
        <div class="lane" data-col="0"><div class="key">F</div></div>
        <div class="lane" data-col="1"><div class="key">G</div></div>
        <div class="lane" data-col="2"><div class="key">H</div></div>
        <div class="lane" data-col="3"><div class="key">J</div></div>
      </div>
      <p class="hint" id="hint">get ready…</p>
      <button class="btn ghost" id="quitBtn">Cancel</button>
    </section>

    <!-- RESULT -->
    <section id="result" hidden>
      <div class="final"><span id="finalScore">0</span> <small id="finalUnit">notes</small></div>
      <div class="rating" id="rating"></div>
      <div class="newbest" id="newBest"></div>
      <div class="summary" id="summary"></div>
      <div class="graph" id="graph"></div>
      <div class="row" style="margin-top:.4rem;">
        <button class="btn" id="againBtn">AGAIN</button>
        <button class="btn ghost" id="settingsBtn">⚙ Settings</button>
      </div>
    </section>
  </div>

<script src="game.js"></script>
</body>
</html>
