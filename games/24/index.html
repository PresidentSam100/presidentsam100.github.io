<a href="../" class="nav-back-games" aria-label="Back to games">&larr; Games</a>

<!-- A 2000s candybar phone. The game runs on its 84×48 LCD (lcd.js). Below
     the screen: the C key, the big Navi key (its label is shown at the
     bottom of the screen) and the up/down rocker; then the keypad, whose
     small print says what each key does in the game. -->
<main class="phone" aria-label="24, played on a phone">
  <div class="earpiece" aria-hidden="true"></div>
  <div class="brand" aria-hidden="true">SAM LU</div>
  <div class="bezel">
    <div class="glass" id="glass">
      <canvas id="lcd" role="img" aria-label="The phone's screen"></canvas>
    </div>
    <span class="sr" id="lcd-live" aria-live="polite"></span>
  </div>

  <div class="controls">
    <button type="button" class="key clear" data-key="C" aria-label="C: back or undo (hold to reset)">C</button>
    <button type="button" class="key navi" data-key="navi" aria-label="Navi key: the action shown at the bottom of the screen"><span></span></button>
    <div class="rocker">
      <button type="button" class="key up" data-key="up" aria-label="Scroll up">▲</button>
      <button type="button" class="key down" data-key="down" aria-label="Scroll down">▼</button>
    </div>
  </div>

  <div class="keypad">
    <button type="button" class="key num" data-key="1" aria-label="1: card 1"><b>1</b><small>card</small></button>
    <button type="button" class="key num" data-key="2" aria-label="2: card 2"><b>2</b><small>card</small></button>
    <button type="button" class="key num" data-key="3" aria-label="3: card 3"><b>3</b><small>card</small></button>
    <button type="button" class="key num" data-key="4" aria-label="4: card 4"><b>4</b><small>card</small></button>
    <button type="button" class="key num" data-key="5" aria-label="5: plus"><b>5</b><small class="op">+</small></button>
    <button type="button" class="key num" data-key="6" aria-label="6: minus"><b>6</b><small class="op">−</small></button>
    <button type="button" class="key num" data-key="7" aria-label="7: times"><b>7</b><small class="op">×</small></button>
    <button type="button" class="key num" data-key="8" aria-label="8: divide"><b>8</b><small class="op">÷</small></button>
    <button type="button" class="key num" data-key="9" aria-label="9: hint"><b>9</b><small>hint</small></button>
    <button type="button" class="key num" data-key="*" aria-label="Star: undo"><b>*</b><small>undo</small></button>
    <button type="button" class="key num" data-key="0" aria-label="0: reset the hand"><b>0</b><small>reset</small></button>
    <button type="button" class="key num" data-key="#" aria-label="Hash: skip"><b>#</b><small>skip</small></button>
  </div>
  <div class="mic" aria-hidden="true"></div>
</main>

<p class="keys-help">Keyboard: <b>1–4</b> cards · <b>+ − × /</b> (or 5–8) · <b>Backspace</b> undo · <b>R</b> reset · <b>H</b> hint · <b>#</b> skip · <b>Enter</b> Navi · <b>↑ ↓</b> scroll · <b>Esc</b> pause</p>
<div class="share-out" id="share-out" hidden>
  <p>Copy your result:</p>
  <textarea readonly rows="3"></textarea>
</div>

<script src="solver.js"></script>
<script src="puzzles.js"></script>
<script src="lcd.js"></script>
<script src="game.js"></script>
</body>
</html>
