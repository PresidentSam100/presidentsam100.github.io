<body>
<a href="../" class="nav-back-games" aria-label="Back to games">&larr; Games</a>

<!-- The watchmaker's tray: navy velvet, brass corners, the plaque, and a
     grid of hunter pocket watches (each one a real <button>). -->
<main id="tray">
  <header class="plaque" id="plaque">
    <h1>LIGHTS OUT</h1>
    <p id="plaque-sub">shut every lid</p>
  </header>

  <div class="hudline" id="hudline" hidden>
    <span id="hud-mode"></span>
    <span id="hud-moves">0 moves</span>
    <span id="hud-par"></span>
    <button type="button" id="hint" title="A hint costs one move">hint</button>
  </div>
  <div class="spring" id="spring" hidden aria-label="Mainspring: moves left">
    <div class="spring-bar" id="spring-bar"></div>
    <span class="spring-label" id="spring-label"></span>
  </div>

  <div id="board" role="grid" aria-label="A tray of pocket watches; clicking one flips its lid and its neighbours'"></div>
</main>

<section class="panel" id="menu">
  <div class="card">
    <h2>The Watchmaker's Tray</h2>
    <p class="how">
      Tap a watch and its hinged lid snaps over — <b>along with its four
      neighbours'</b>. Shut every lid to finish. Open dials tell the real
      time; the trick is that every press flips five at once.
    </p>
    <div class="pick">
      <div class="seg" id="pick-mode">
        <button type="button" data-v="windup"><b>Wind-up</b><small>levels on a move budget <kbd>1</kbd></small></button>
        <button type="button" data-v="daily"><b>Daily</b><small id="daily-small">today's tray, share your moves <kbd>2</kbd></small></button>
        <button type="button" data-v="zen"><b>Zen</b><small>no budget, pick a size <kbd>3</kbd></small></button>
      </div>
      <div class="seg sizes" id="pick-size" hidden>
        <button type="button" data-n="3"><b>3×3</b></button>
        <button type="button" data-n="5"><b>5×5</b></button>
        <button type="button" data-n="7"><b>7×7</b></button>
      </div>
    </div>
    <button type="button" class="playbtn" id="play"><b>Open the tray</b> <kbd>Enter</kbd></button>
    <p class="bests" id="bests"></p>
  </div>
</section>

<section class="panel" id="over" hidden>
  <div class="card">
    <h2 id="over-title">All lids shut</h2>
    <p class="big" id="over-msg"></p>
    <p class="stats" id="over-stats"></p>
    <div class="row">
      <button type="button" id="again">Next <kbd>Enter</kbd></button>
      <button type="button" id="share" hidden>Share result</button>
      <button type="button" id="to-menu">Modes <span class="gs-keys"><kbd title="Backspace">⌫</kbd></span></button>
    </div>
  </div>
</section>

<script src="art.js"></script>
<script src="game.js"></script>
