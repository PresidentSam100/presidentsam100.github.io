<body>
<a href="../" class="nav-back-games" aria-label="Back to games">&larr; Games</a>

<!-- The picture house's front: glazed tiles, the name in lights over a
     letterboard, and the sign itself, a grid of big bulbs (each one a real
     <button>) inside a ring of chaser lights. -->
<main id="front">
  <header id="head">
    <div class="sign">
      <h1>LIGHTS OUT</h1>
      <p class="letterboard" id="sign-sub">put out every bulb</p>
    </div>

    <div class="hudline" id="hudline" hidden>
      <span id="hud-mode"></span>
      <span id="hud-moves">0 moves</span>
      <span id="hud-par"></span>
      <button type="button" id="hint" title="A hint costs one move">hint</button>
    </div>
    <div class="reel" id="reel" hidden aria-label="Reel: moves left">
      <div class="reel-film" id="reel-film"></div>
      <span class="reel-label" id="reel-label"></span>
    </div>
  </header>

  <div id="board" role="grid" aria-label="A marquee of light bulbs; pressing one switches it and its neighbours"></div>
</main>

<section class="panel" id="menu">
  <div class="card">
    <h2>Closing Time</h2>
    <p class="how">
      The last show is over and the marquee is still blazing. Tap a bulb to
      switch it — <b>along with its four neighbours</b>. Put out every bulb
      to close up; the trick is that every press flips five at once.
    </p>
    <div class="pick">
      <div class="seg" id="pick-mode">
        <button type="button" data-v="windup"><b>Last Reel</b><small>levels on a move budget <span class="gs-keys"><kbd>1</kbd></span></small></button>
        <button type="button" data-v="daily"><b>Daily</b><small id="daily-small">today's sign, share your moves <span class="gs-keys"><kbd>2</kbd></span></small></button>
        <button type="button" data-v="zen"><b>Zen</b><small>no budget, pick a size <span class="gs-keys"><kbd>3</kbd></span></small></button>
      </div>
      <div class="seg sizes" id="pick-size" hidden>
        <button type="button" data-n="3"><b>3×3</b> <span class="gs-keys"><kbd>4</kbd></span></button>
        <button type="button" data-n="5"><b>5×5</b> <span class="gs-keys"><kbd>5</kbd></span></button>
        <button type="button" data-n="7"><b>7×7</b> <span class="gs-keys"><kbd>6</kbd></span></button>
      </div>
    </div>
    <button type="button" class="playbtn" id="play"><b>Hit the lights</b> <span class="gs-keys"><kbd>Enter</kbd></span></button>
    <p class="bests" id="bests"></p>
  </div>
</section>

<section class="panel" id="over" hidden>
  <div class="card">
    <h2 id="over-title">Lights out</h2>
    <p class="big" id="over-msg"></p>
    <p class="stats" id="over-stats"></p>
    <div class="row">
      <button type="button" id="again">Next <span class="gs-keys"><kbd>Enter</kbd></span></button>
      <button type="button" id="share" hidden>Share result</button>
      <button type="button" id="to-menu">Modes <span class="gs-keys"><kbd title="Backspace">⌫</kbd></span></button>
    </div>
  </div>
</section>

<script src="art.js"></script>
<script src="game.js"></script>
</body>
</html>
