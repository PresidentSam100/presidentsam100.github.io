<body>
  <a href="../" class="nav-back-games" aria-label="Back to games" style="position:fixed;top:12px;left:12px;z-index:99999;text-decoration:none;font:700 13px/1 'Inter',system-ui,sans-serif;color:#eef2f9;background:#141826;border:1px solid #232838;border-radius:8px;padding:8px 13px">&larr; Games</a>

  <div class="wrap">
    <header class="top">
      <h1>⚡ Reaction</h1>
      <p>tap the instant the screen turns green</p>
    </header>

    <div class="hud">
      <div class="stat"><div class="label">Attempt</div><div class="value" id="attempt">—</div></div>
      <div class="stat"><div class="label">Last</div><div class="value" id="last">—</div></div>
      <div class="stat"><div class="label">Avg</div><div class="value" id="avg">—</div></div>
      <div class="stat"><div class="label">Best avg</div><div class="value" id="best">—</div></div>
    </div>

    <div class="panel idle" id="panel">
      <div class="big" id="panel-big">⚡ Reaction</div>
      <div class="sub" id="panel-sub">press start to begin</div>
      <div class="rating" id="panel-rating"></div>
    </div>

    <div class="times" id="times"></div>

    <p class="hint">tap the panel or press <b>Space</b> the moment it flashes green — don't jump early!</p>
  </div>

  <div class="overlay show" id="overlay"><div class="card" id="card"></div></div>
