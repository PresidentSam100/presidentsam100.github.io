<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ctext%20y%3D%220.9em%22%20font-size%3D%2288%22%3E%F0%9F%94%A2%3C%2Ftext%3E%3C%2Fsvg%3E" />
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>2048</title>
    <meta name="author" content="Sam Lu" />
    <meta name="description" content="2048 — join the tiles, get to 2048!" />

    <link rel="stylesheet" href="styles.css" />
  <script src="../motion-toggle.js"></script>
  <script src="../mute-toggle.js"></script>
    <meta property="og:title" content="2048 — Sam Lu" />
    <meta property="og:type" content="website" />
    <meta property="og:description" content="2048 — slide and merge tiles to reach 2048. A browser game by Sam Lu." />
    <meta name="twitter:card" content="summary" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-H1K8QYFCV5"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag("js", new Date());
      gtag("config", "G-H1K8QYFCV5");
    </script>
</head>
  <body>
    <div class="wrap">
      <a href="../" class="nav-back-games" aria-label="Back to games" style="position:fixed;top:12px;left:12px;z-index:99999;text-decoration:none;font:700 13px/1 'Inter',sans-serif;color:#eef0f4;background:#1c1c26;border:1px solid #2e2e3c;border-radius:8px;padding:8px 13px">&larr; Games</a>

      <div class="topbar">
        <div>
          <h1 class="title">2048</h1>
          <p class="subtitle">join the tiles, reach <b id="target">2048</b>!</p>
        </div>
        <div class="scores">
          <div class="score-box">
            <div class="label">Score</div>
            <div class="val" id="score">0</div>
          </div>
          <div class="score-box">
            <div class="label">Best</div>
            <div class="val" id="best">0</div>
          </div>
        </div>
      </div>

      <div class="controls">
        <button class="btn" id="mode-normal">Normal</button>
        <button class="btn" id="mode-fib">Fibonacci</button>
      </div>

      <div class="board-wrap">
        <div class="board" id="board">
          <div class="grid-bg" id="grid-bg"></div>
          <div class="tiles" id="tiles"></div>
        </div>
        <div class="overlay" id="overlay">
          <h2 id="overlay-title">Game Over</h2>
          <p id="overlay-msg"></p>
          <div class="btn-row">
            <button class="btn" id="overlay-retry">Try Again</button>
            <button class="btn ghost" id="overlay-keepgoing" style="display:none">
              Keep Going
            </button>
          </div>
        </div>
      </div>

      <p id="byline">made by sam lu (not you)</p>
    </div>

<script src="game.js"></script>
  </body>
</html>
